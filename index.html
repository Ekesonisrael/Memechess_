<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#08040e" />
    <title>MemeChess</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      :root {
        --bg: #08040e;
        --fg: #f2f2f2;
        --card: #1a1226;
        --ac: #a855f7;
        --lt: #7c3aed;
        --dk: #0a0416;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.4 system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .scr {
        display: none;
        flex: 1;
        padding: 12px;
        max-width: 560px;
        margin: 0 auto;
        width: 100%;
      }
      .scr.on {
        display: flex;
        flex-direction: column;
        animation: slidein 0.28s ease-out;
      }
      @keyframes slidein {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes pop {
        from {
          transform: scale(0.7);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes qpop {
        from {
          transform: scale(0.3);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes blinkfade {
        0% {
          opacity: 1;
        }
        60% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes dotpulse {
        50% {
          transform: scale(1.15);
        }
      }
      @keyframes checkpulse {
        0%,
        100% {
          box-shadow:
            inset 0 0 0 3px #ef4444,
            inset 0 0 22px 6px rgba(239, 68, 68, 0.75);
        }
        50% {
          box-shadow:
            inset 0 0 0 3px #ff2a2a,
            inset 0 0 32px 12px rgba(239, 68, 68, 1);
        }
      }
      @keyframes bannerin {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes msgin {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes sl {
        from {
          transform: scale(4);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes checkbadge {
        from {
          transform: translate(-50%, -10px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }
      h1 {
        font:
          900 clamp(32px, 10vw, 44px) Impact,
          sans-serif;
        text-align: center;
        margin: 16px 0 4px;
        color: var(--ac);
        letter-spacing: 1px;
        animation: pop 0.5s;
      }
      .sub {
        text-align: center;
        opacity: 0.6;
        margin-bottom: 20px;
        font-size: 14px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 15px 16px;
        margin: 8px 0;
        border: 0;
        border-radius: 12px;
        background: var(--card);
        color: var(--fg);
        font-weight: 700;
        text-align: left;
        cursor: pointer;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn.p {
        background: var(--ac);
        color: #fff;
        text-align: center;
        font-size: 19px;
        border-bottom: 4px solid #7e22ce;
      }
      .btn.g {
        background: #16a34a;
        color: #fff;
        text-align: center;
        font-size: 18px;
        border-bottom: 4px solid #15803d;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .top button {
        background: none;
        border: 0;
        color: var(--fg);
        font-size: 26px;
        padding: 0 6px;
        cursor: pointer;
      }
      .seg {
        display: flex;
        gap: 6px;
        margin: 10px 0;
      }
      .seg button {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid transparent;
        background: var(--card);
        color: var(--fg);
        font-weight: 700;
        cursor: pointer;
      }
      .seg .on {
        border-color: var(--ac);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card);
        padding: 12px;
        border-radius: 12px;
        margin: 8px 0;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--ac);
        height: 30px;
      }
      .big {
        font-size: 20px;
        font-weight: 800;
        text-align: center;
        padding: 4px 0;
      }
      #ev {
        height: 22px;
        background: #3a2a4a;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        margin: 4px 0;
      }
      #evf {
        height: 100%;
        background: #e8e8ee;
        width: 50%;
        transition: width 0.4s;
      }
      #evt {
        position: absolute;
        right: 8px;
        top: 0;
        font-weight: 700;
        color: #111;
        font-size: 13px;
        line-height: 22px;
      }
      #coach {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin: 6px 0;
      }
      #face {
        width: 72px;
        height: 72px;
        flex: none;
        border-radius: 50%;
        background: #fff;
        overflow: hidden;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      }
      #face svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ct {
        background: #fff;
        color: #1a1226;
        padding: 10px 14px;
        border-radius: 14px;
        flex: 1;
        font-size: 14px;
        min-height: 44px;
        display: flex;
        align-items: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #ct.flash {
        animation: msgin 0.3s;
      }
      #log {
        max-height: 0;
        overflow: hidden;
        font-size: 13px;
        margin: 0;
        transition: max-height 0.25s;
      }
      #log.open {
        max-height: 180px;
        overflow-y: auto;
        margin: 6px 0;
      }
      #log div {
        padding: 5px 10px;
        margin: 3px 0;
        border-radius: 10px;
        background: #1a1226;
      }
      #log .u {
        background: var(--ac);
        text-align: right;
        color: #fff;
      }
      #logbtn {
        background: none;
        border: 0;
        color: #9a9a9a;
        font-size: 12px;
        padding: 2px 6px;
        cursor: pointer;
        align-self: flex-start;
      }
      .clk {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        margin: 4px 0;
        font-size: 14px;
      }
      .clk b {
        background: #241a33;
        padding: 3px 10px;
        border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }
      #opname {
        display: none;
        background: linear-gradient(90deg, #1e1b4b, #312e81, #1e1b4b);
        color: #fde68a;
        padding: 8px 14px;
        border-radius: 10px;
        margin: 6px 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.5px;
        border-left: 4px solid #facc15;
        box-shadow: 0 2px 12px rgba(168, 85, 247, 0.35);
      }
      #opname.on {
        display: block;
        animation: bannerin 0.35s;
      }
      #opname .icon {
        opacity: 0.9;
        margin-right: 6px;
      }
      #bdwrap {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        aspect-ratio: 1;
        width: 100%;
        max-width: min(92vw, 480px);
        margin: 0 auto;
        box-shadow: 0 6px 24px rgba(168, 85, 247, 0.35);
      }
      #bd {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: 100%;
        height: 100%;
        user-select: none;
        touch-action: manipulation;
      }
      .sq {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .sq svg {
        width: 96%;
        height: 96%;
        display: block;
        z-index: 3;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
      }
      .sq.lm::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(250, 204, 21, 0.45);
        pointer-events: none;
        z-index: 1;
      }
      .sq.ht::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(34, 197, 94, 0.5);
        pointer-events: none;
        z-index: 1;
      }
      .sq.blunder::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(239, 68, 68, 0.7);
        pointer-events: none;
        animation: blinkfade 1.6s forwards;
        z-index: 1;
      }
      .sq.incheck::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle,
          rgba(239, 68, 68, 0.35) 0%,
          rgba(239, 68, 68, 0) 70%
        );
        pointer-events: none;
        z-index: 1;
      }
      .sq.incheck {
        animation: checkpulse 1.1s ease-in-out infinite;
      }
      .sq .checkbadge {
        position: absolute;
        top: 4px;
        left: 50%;
        transform: translateX(-50%);
        background: #ef4444;
        color: #fff;
        font-weight: 900;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        z-index: 5;
        letter-spacing: 1px;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.9);
        animation: checkbadge 0.4s;
      }
      .sq .qbadge {
        position: absolute;
        top: 3px;
        right: 3px;
        font-weight: 900;
        font-size: 14px;
        padding: 2px 8px;
        border-radius: 10px;
        z-index: 6;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.85);
        animation: qpop 0.3s;
      }
      .qbadge.q-blunder {
        background: #dc2626;
        color: #fff;
      }
      .qbadge.q-mistake {
        background: #ea580c;
        color: #fff;
      }
      .qbadge.q-inacc {
        background: #eab308;
        color: #111;
      }
      .qbadge.q-good {
        background: #22c55e;
        color: #052e16;
      }
      .qbadge.q-best {
        background: #0ea5e9;
        color: #fff;
      }
      .sq.sel {
        outline: 4px solid #facc15;
        outline-offset: -4px;
        z-index: 4;
      }
      .sq .mvdot {
        width: 36%;
        height: 36%;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #fff,
          #e9d5ff 60%,
          #a855f7 100%
        );
        box-shadow:
          0 0 0 3px #1a0b2e,
          0 0 16px 5px rgba(168, 85, 247, 0.95);
        position: absolute;
        z-index: 2;
        animation: dotpulse 1.4s ease-in-out infinite;
      }
      .sq.cap::before {
        content: "";
        position: absolute;
        inset: 2%;
        border-radius: 50%;
        border: 3px solid rgba(239, 68, 68, 0.85);
        z-index: 2;
        pointer-events: none;
      }
      .sq[data-r]::before {
        content: attr(data-r);
        position: absolute;
        top: 0;
        left: 3px;
        font-size: 10px;
        opacity: 0.55;
        color: #000;
        z-index: 2;
      }
      .sq[data-f]::after {
        content: attr(data-f);
        position: absolute;
        bottom: 0;
        right: 4px;
        font-size: 10px;
        opacity: 0.55;
        color: #000;
        z-index: 2;
      }
      .sq.dk[data-r]::before,
      .sq.dk[data-f]::after {
        color: #ccc;
      }
      .sh {
        animation: sh 0.35s;
      }
      .bg {
        animation: sh 0.6s;
      }
      @keyframes sh {
        20% {
          transform: translate(-6px, 3px);
        }
        40% {
          transform: translate(6px, -4px);
        }
        60% {
          transform: translate(-4px, -3px);
        }
        80% {
          transform: translate(4px, 3px);
        }
      }
      #ml {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px 0;
        white-space: nowrap;
        scrollbar-width: thin;
      }
      #ml span {
        background: var(--card);
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 13px;
      }
      #ml .q {
        color: #f87171;
      }
      #bar {
        display: flex;
        justify-content: space-around;
        margin-top: 6px;
      }
      #bar button {
        background: none;
        border: 0;
        color: #bbb;
        font-weight: 700;
        padding: 8px 4px;
        font-size: 13px;
        cursor: pointer;
      }
      #opt {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        background: var(--card);
        border: 0;
        color: var(--fg);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        font-size: 22px;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #optpanel {
        display: none;
        position: fixed;
        top: 58px;
        right: 12px;
        z-index: 11;
        background: #241a33;
        border-radius: 12px;
        padding: 6px;
        min-width: 200px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }
      #optpanel.on {
        display: block;
        animation: slidein 0.15s;
      }
      #optpanel button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        color: var(--fg);
        padding: 12px 14px;
        font-weight: 700;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      #optpanel button:active {
        background: #3a2a4a;
      }
      #tp {
        display: none;
        background: var(--ac);
        padding: 8px;
        border-radius: 8px;
        font-weight: 700;
        margin: 6px 0;
        color: #fff;
        text-align: center;
        font-size: 14px;
      }
      .tr #tp {
        display: block;
      }
      .tr #ev,
      .tr .pl,
      .tr #ml,
      .tr #opname {
        display: none !important;
      }
      #chatwrap {
        margin: 8px 0;
      }
      #qr {
        display: flex;
        gap: 6px;
        background: #1a1226;
        border-radius: 12px;
        padding: 5px 8px;
      }
      #qr input {
        flex: 1;
        background: none;
        border: 0;
        color: inherit;
        outline: 0;
        padding: 8px 4px;
        font-size: 14px;
        min-width: 0;
      }
      #qr button {
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 700;
        cursor: pointer;
        font-size: 13px;
      }
      #end {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0, 0, 0, 0.88);
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      #end.on {
        display: flex;
        animation: fadein 0.3s;
      }
      #endcard {
        background: #1a1226;
        border-radius: 16px;
        padding: 22px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        max-height: 90vh;
        overflow-y: auto;
        animation: slidein 0.4s;
      }
      #endword {
        font:
          900 clamp(28px, 8vw, 40px) Impact,
          sans-serif;
        color: #facc15;
        margin-bottom: 8px;
        animation: pop 0.55s;
      }
      #endsub {
        opacity: 0.9;
        margin-bottom: 16px;
        font-size: 15px;
      }
      #endstats {
        display: flex;
        justify-content: space-around;
        margin: 16px 0;
        gap: 8px;
      }
      .stat {
        text-align: center;
        flex: 1;
      }
      .stat b {
        display: block;
        font-size: 26px;
        color: var(--ac);
      }
      .stat small {
        opacity: 0.6;
        font-size: 10px;
        text-transform: uppercase;
      }
      #endbtns {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }
      #endbtns button {
        padding: 14px;
        border-radius: 12px;
        border: 0;
        font-weight: 800;
        background: var(--ac);
        color: #fff;
        cursor: pointer;
        font-size: 15px;
      }
      #endbtns button.sec {
        background: #2a2733;
        color: var(--fg);
      }
      #endbtns button.g {
        background: #16a34a;
      }
      #fat {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0, 0, 0, 0.97);
        color: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      #fat.on {
        display: flex;
      }
      .f1 {
        font:
          900 clamp(40px, 13vw, 90px) Impact,
          sans-serif;
        color: #facc15;
      }
      .f2 {
        font:
          900 clamp(48px, 16vw, 110px) Impact,
          sans-serif;
        animation: sl 0.55s;
      }
      #review {
        display: none;
        flex-direction: column;
      }
      #review.on {
        display: flex;
      }
      #rboard {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        aspect-ratio: 1;
        width: 100%;
        max-width: min(92vw, 480px);
        margin: 0 auto;
      }
      #rbd {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: 100%;
        height: 100%;
      }
      #rbd .sq {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #rarrow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #rnav {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 12px 0;
      }
      #rnav button {
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 11px 22px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
      }
      #rnav button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #rcomment {
        background: #fff;
        color: #1a1226;
        padding: 12px 16px;
        border-radius: 14px;
        min-height: 56px;
        font-size: 14px;
        margin: 8px 0;
        display: flex;
        align-items: center;
        line-height: 1.35;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 14px;
        margin: 8px 0;
      }
      .card h3 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .card p {
        margin: 0;
        opacity: 0.7;
        font-size: 13px;
      }
      .progbar {
        height: 8px;
        background: #2a2733;
        border-radius: 4px;
        overflow: hidden;
        margin: 10px 0;
      }
      .progbar > div {
        height: 100%;
        background: var(--ac);
        transition: width 0.3s;
      }
      .drillrow {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .drillrow button {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: 0;
        background: var(--ac);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        font-size: 14px;
      }
      .drillrow button.sec {
        background: #2a2733;
        color: var(--fg);
      }
      .swatch {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card);
        padding: 10px 14px;
        border-radius: 12px;
        margin: 8px 0;
      }
      .swatch input[type="color"] {
        width: 48px;
        height: 34px;
        border: 0;
        background: none;
        border-radius: 6px;
        padding: 0;
        cursor: pointer;
      }
      .swatch label {
        flex: 1;
        font-weight: 600;
        font-size: 14px;
      }
      .volrow {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        padding: 10px 14px;
        border-radius: 12px;
        margin: 8px 0;
      }
      .volrow label {
        min-width: 60px;
        font-weight: 600;
        font-size: 14px;
      }
      .volrow input[type="range"] {
        flex: 1;
      }
      .volrow .volval {
        min-width: 34px;
        text-align: right;
        font-weight: 700;
        font-size: 13px;
        color: var(--ac);
      }
      small {
        opacity: 0.6;
      }
      #journeycard {
        background: linear-gradient(135deg, #1e1b4b, #312e81);
        border-radius: 14px;
        padding: 16px;
        margin: 8px 0;
        border-left: 4px solid #facc15;
      }
      #journeycard h3 {
        margin: 0 0 8px;
        font-size: 17px;
        color: #fde68a;
      }
      #journeycard p {
        margin: 0 0 10px;
        font-size: 13px;
        opacity: 0.9;
      }
      #journeycard .lvlrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 10px;
        padding: 8px 12px;
        margin: 6px 0;
      }
      #journeycard .lvlrow .lvlname {
        font-weight: 700;
        font-size: 14px;
      }
      #journeycard .lvlrow .lvlstat {
        font-size: 12px;
        opacity: 0.85;
      }
      #journeycard .lvlrow.done {
        border-left: 3px solid #22c55e;
      }
      #journeycard .lvlrow.current {
        border-left: 3px solid #facc15;
        background: rgba(250, 204, 21, 0.12);
      }
      #journeycard .lvlrow.locked {
        opacity: 0.5;
      }
      #journeycard button {
        margin-top: 8px;
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 0;
        background: #facc15;
        color: #111;
        font-weight: 800;
        cursor: pointer;
        font-size: 15px;
      }

    <div id="menu" class="scr on">
      <h1>MemeChess</h1>
      <div class="sub">Get cooked. Get better.</div>
      <button class="btn p" onclick="show('setup')">♟ Play vs Coach</button>
      <button class="btn" onclick="openTrain()">🎯 Training</button>
      <button class="btn" onclick="openSettings()">⚙️ Settings</button>
      <button class="btn" onclick="prog()">📈 Progress</button>
    </div>

    <div id="setup" class="scr">
      <div class="top"><button onclick="show('menu')">←</button>New game</div>
      <div class="seg" id="side">
        <button data-v="w" class="on">White</button
        ><button data-v="r">Random</button><button data-v="b">Black</button>
      </div>
      <div class="big" id="elol">Beginner · ELO 800</div>
      <input
        type="range"
        id="elo"
        min="400"
        max="2000"
        step="100"
        value="800"
        oninput="eloLab()"
      />
      <div class="row">
        <span>⏱ Timer</span
        ><input
          type="checkbox"
          id="tm"
          checked
          onchange="
            document.getElementById('tmo').style.display = this.checked
              ? 'block'
              : 'none'
          "
        />
      </div>
      <div id="tmo">
        <div class="row"><span>Minutes</span><b id="mnl">10</b></div>
        <input
          type="range"
          id="mn"
          min="1"
          max="60"
          value="10"
          oninput="document.getElementById('mnl').textContent = this.value"
        />
        <div class="row"><span>Bonus sec/move</span><b id="icl">0</b></div>
        <input
          type="range"
          id="ic"
          min="0"
          max="30"
          value="0"
          oninput="document.getElementById('icl').textContent = this.value"
        />
      </div>
      <div class="row">
        <span>↩ Undo moves</span><input type="checkbox" id="un" checked />
      </div>
      <div class="row">
        <span>💡 Move hints</span><input type="checkbox" id="hn" checked />
      </div>
      <div class="row">
        <span>🔈 Coach voice</span><input type="checkbox" id="vo" checked />
      </div>
      <button class="btn p" onclick="startGame()">Play</button>
    </div>

    <div id="settings" class="scr">
      <div class="top"><button onclick="show('menu')">←</button>Settings</div>
      <div class="volrow">
        <label>🎵 Music</label
        ><input
          type="range"
          id="musicvol"
          min="0"
          max="100"
          value="50"
          oninput="setMusicVol(this.value)"
        /><span class="volval" id="musicvolval">50</span>
      </div>
      <div class="row">
        <span>🔇 Mute music</span
        ><input type="checkbox" id="musicmute" onchange="toggleMusicMute()" />
      </div>
      <div class="volrow">
        <label>🔊 SFX</label
        ><input
          type="range"
          id="sfxvol"
          min="0"
          max="100"
          value="70"
          oninput="setSfxVol(this.value)"
        /><span class="volval" id="sfxvolval">70</span>
      </div>
      <div class="row">
        <span>🔇 Mute SFX</span
        ><input type="checkbox" id="sfxmute" onchange="toggleSfxMute()" />
      </div>
      <button class="btn" onclick="show('menu')">Done</button>
    </div>

    <div id="trainmenu" class="scr">
      <div class="top"><button onclick="show('menu')">←</button>Training</div>
      <div id="tlist"></div>
    </div>

    <div id="theme" class="scr">
      <div class="top"><button onclick="show('menu')">←</button>Board</div>
      <div class="swatch">
        <label>Light squares</label
        ><input type="color" id="c-lt" oninput="applyTheme()" />
      </div>
      <div class="swatch">
        <label>Dark squares</label
        ><input type="color" id="c-dk" oninput="applyTheme()" />
      </div>
      <button class="btn" onclick="resetTheme()">Reset default (purple)</button>
      <button class="btn p" onclick="show('menu')">Done</button>
    </div>

    <div id="game" class="scr">
      <button
        id="opt"
        onclick="
          event.stopPropagation();
          toggleOpt();
        "
      >
        ⋯
      </button>
      <div id="optpanel">
        <button onclick="flipBoard()">🔄 Flip board</button>
        <button onclick="restartNow()">🔁 Restart game</button>
        <button onclick="resign()">⚑ Resign</button>
        <button onclick="leave()">🏠 Main menu</button>
      </div>
      <div class="top"><button onclick="leave()">←</button>MemeChess</div>
      <div id="tp"></div>
      <div class="pl">
        <div id="ev">
          <div id="evf"></div>
          <span id="evt">0.00</span>
        </div>
      </div>
      <div id="opname"></div>
      <div id="coach">

            <circle

        <div id="ct">Ready to get cooked?</div>

          <input
            id="qi"

    <script>
      const GEMINI_KEY =
        "AQ.Ab8RN6KaHfKj12x4ppQVUXuFX5pNJll4G5452ck3a5fDx2v7lQ";

      /* ==========================================================
   SOUND FILE COUNTS — based on what you actually have
   ========================================================== */
      const POOL_SIZES = {
        theme: 20, // you have up to 20
        move: 20, // try 20; if folder missing it falls back to synth
        capture: 14, // you have 14
        check: 11, // you have 11

        lose: 10, // you have 10
      };

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);

      S.musicVol = S.musicVol !== undefined ? S.musicVol : 0.5;
      S.sfxVol = S.sfxVol !== undefined ? S.sfxVol : 0.7;
      S.musicMute = S.musicMute || false;
      S.sfxMute = S.sfxMute || false;
      S.journey = S.journey || { level: 0, unlocked: 0, completed: [] };
      S.eloHistory = S.eloHistory || [];
      const save = () => {
        try {
          localStorage.setItem("mc", JSON.stringify(S));

      /* ============================================================

      let AC = null,
        sfxGain = null,
        audioUnlocked = false;

      function ac() {
        if (!AC) {
          try {
            AC = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            AC = null;
            return null;
          }
        }
        if (AC && AC.state === "suspended") AC.resume().catch(() => {});
        return AC;
      }

      function unlockAudio() {
        try {
          const c = ac();
          if (!c) return;
          if (c.state === "suspended") c.resume().catch(() => {});
          if (!sfxGain) {
            sfxGain = c.createGain();
            sfxGain.gain.value = S.sfxMute ? 0 : S.sfxVol;
            sfxGain.connect(c.destination);
          } else if (!S.sfxMute) {
            sfxGain.gain.value = S.sfxVol;
          }
          if (!audioUnlocked) {
            const buf = c.createBuffer(1, 1, c.sampleRate);
            const src = c.createBufferSource();
            src.buffer = buf;
            src.connect(c.destination);
            src.start(0);
            audioUnlocked = true;
          }
        } catch (e) {}
      }
      ["click", "touchstart", "keydown", "pointerdown"].forEach((evt) => {
        document.addEventListener(evt, unlockAudio, { passive: true });
      });

      /* ---------- Music ---------- */
      let musicEl = null,
        musicFadeId = null,
        musicErrStreak = 0;
      function clearMusicFade() {
        if (musicFadeId) {
          clearInterval(musicFadeId);
          musicFadeId = null;
        }
      }

      function fadeMusicTo(target, ms, done) {
        clearMusicFade();
        if (!musicEl) {
          if (done) done();
          return;
        }
        const start = musicEl.volume;
        const steps = Math.max(1, Math.round(ms / 40));
        let i = 0;
        musicFadeId = setInterval(() => {
          i++;
          const v = start + (target - start) * (i / steps);
          if (musicEl) musicEl.volume = Math.max(0, Math.min(1, v));
          if (i >= steps) {
            clearMusicFade();
            if (done) done();
          }
        }, 40);
      }

      function startMenuMusic() {
        if (S.musicMute) return;
        if (musicEl && !musicEl.paused) {
          fadeMusicTo(S.musicVol, 900);
          return;
        }
        const url = nextFromPool("theme");
        if (!url) return;
        try {
          if (musicEl) {
            try {
              musicEl.pause();
            } catch (e) {}
          }
          const el = new Audio(url);
          musicEl = el;
          el.volume = 0;
          el.loop = false;
          el.onended = () => {
            if (musicEl === el) musicEl = null;
            startMenuMusic();
          };
          el.onerror = () => {
            if (musicEl === el) musicEl = null;
            musicErrStreak++;
            if (musicErrStreak < 6) setTimeout(startMenuMusic, 1500);
          };
          el.play()
            .then(() => {
              musicErrStreak = 0;
              fadeMusicTo(S.musicVol, 1400);
            })
            .catch(() => {});
        } catch (e) {}
      }

      function stopMusicFade(ms) {
        ms = ms === undefined ? 900 : ms;
        clearMusicFade();
        const el = musicEl;
        if (!el) return;
        fadeMusicTo(0, ms, () => {
          try {
            el.pause();
          } catch (e) {}
          if (musicEl === el) musicEl = null;
        });
      }
      function stopMusicNow() {
        clearMusicFade();
        if (musicEl) {
          try {
            musicEl.pause();
          } catch (e) {}
          musicEl = null;
        }
      }
      function setMusicVol(v) {
        S.musicVol = v / 100;
        save();
        if (musicEl && !musicFadeId)
          musicEl.volume = S.musicMute ? 0 : S.musicVol;
        const l = $("#musicvolval");
        if (l) l.textContent = v;
      }
      function setSfxVol(v) {
        S.sfxVol = v / 100;
        save();
        if (sfxGain) sfxGain.gain.value = S.sfxMute ? 0 : S.sfxVol;
        if (curSfxEl) curSfxEl.volume = S.sfxMute ? 0 : S.sfxVol;
        const l = $("#sfxvolval");
        if (l) l.textContent = v;
      }
      function toggleMusicMute() {
        S.musicMute = $("#musicmute").checked;
        save();
        if (S.musicMute) {
          stopMusicNow();
        } else if (!$("#game").classList.contains("on")) {
          startMenuMusic();
        }
      }
      function toggleSfxMute() {
        S.sfxMute = $("#sfxmute").checked;
        save();
        if (sfxGain) sfxGain.gain.value = S.sfxMute ? 0 : S.sfxVol;
        if (S.sfxMute) stopSfx();
        else if (curSfxEl) curSfxEl.volume = S.sfxVol;
      }

      /* ---------- Sound pools ---------- */
      const SOUND_POOLS = {};
      for (const k in POOL_SIZES) {
        SOUND_POOLS[k] = Array.from(
          { length: POOL_SIZES[k] },
          (_, i) => `${k}/${i + 1}.mp3`,
        );
      }
      const poolDecks = {};
      const poolDead = {}; /* marked true if 3+ files fail to load */
      const poolFailCount = {};

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function nextFromPool(name) {
        if (poolDead[name]) return null;
        if (!poolDecks[name] || !poolDecks[name].length)
          poolDecks[name] = shuffle(SOUND_POOLS[name] || []);
        return poolDecks[name].pop();
      }
      function reportPoolFail(name) {
        poolFailCount[name] = (poolFailCount[name] || 0) + 1;
        if (poolFailCount[name] >= 3) {
          poolDead[name] = true;
          try {
            console.log(
              '[audio] Pool "' +
                name +
                '" marked dead — using synth fallback from now on.',
            );
          } catch (e) {}
        }
      }

      /* ---------- Synth (fallback for missing folders) ---------- */
      const PROFILES = {
        move: [
          () => tone(560, 320, 0.09, "sine", 0.32),
          () => tone(500, 290, 0.09, "sine", 0.32),
          () => tone(620, 350, 0.08, "triangle", 0.3),
        ],
        capture: [
          () => {
            tone(240, 80, 0.22, "square", 0.5);
            noise(0.16, 0.4, 700);
          },
          () => {
            tone(180, 60, 0.26, "square", 0.48);
            noise(0.14, 0.35, 500);
          },
          () => {
            tone(320, 120, 0.2, "sawtooth", 0.4);
          },
        ],
        check: [
          () =>
            [0, 0.14, 0.28].forEach((t) =>
              tone(780, 730, 0.13, "sawtooth", 0.35, t),
            ),
          () =>
            [0, 0.18].forEach((t) => tone(680, 640, 0.17, "triangle", 0.32, t)),
          () => {
            tone(900, 600, 0.18, "square", 0.35);
            tone(600, 400, 0.18, "square", 0.32, 0.14);
          },
        ],
        win: [
          () =>
            [0, 0.1, 0.2, 0.34].forEach((t) =>
              tone(520 + t * 220, 500, 0.16, "triangle", 0.36, t),
            ),
          () =>
            [523, 659, 784, 1047].forEach((f, i) =>
              tone(f, f, 0.22, "sine", 0.34, i * 0.11),
            ),
        ],
        lose: [
          () => {
            tone(220, 70, 0.55, "sawtooth", 0.44);
            noise(0.3, 0.4, 450);
          },
          () => {
            tone(180, 60, 0.6, "square", 0.4);
            tone(120, 50, 0.65, "sawtooth", 0.35, 0.1);
          },
        ],
      };
      const lastPick = {};
      function tone(a, b, d, ty = "sine", v = 0.3, t = 0) {
        try {
          const c = ac();
          if (!c) return;
          const o = c.createOscillator(),
            n = c.createGain(),
            s = c.currentTime + t;
          o.type = ty;
          o.frequency.setValueAtTime(a, s);
          o.frequency.exponentialRampToValueAtTime(Math.max(b, 1), s + d);
          n.gain.setValueAtTime(v, s);
          n.gain.exponentialRampToValueAtTime(0.001, s + d);
          o.connect(n).connect(sfxGain || c.destination);
          o.start(s);
          o.stop(s + d);
        } catch (e) {}
      }
      function noise(d, v = 0.5, f = 1000) {
        try {
          const c = ac();
          if (!c) return;
          const b = c.createBuffer(
              1,
              Math.max(1, Math.floor(c.sampleRate * d)),
              c.sampleRate,
            ),
            a = b.getChannelData(0);
          for (let i = 0; i < a.length; i++)
            a[i] = (Math.random() * 2 - 1) * (1 - i / a.length);
          const s = c.createBufferSource(),
            fl = c.createBiquadFilter(),
            n = c.createGain();
          fl.frequency.value = f;
          n.gain.value = v;
          s.buffer = b;
          s.connect(fl)
            .connect(n)
            .connect(sfxGain || c.destination);
          s.start();
        } catch (e) {}
      }
      function synth(prof) {
        const pool = PROFILES[prof] || PROFILES.move;
        let i,
          t = 0;
        do {
          i = (Math.random() * pool.length) | 0;
        } while (pool.length > 1 && i === lastPick[prof] && t++ < 8);
        lastPick[prof] = i;
        try {
          pool[i]();
        } catch (e) {}
      }

      /* ---------- SFX player (fresh Audio per sound) ---------- */
      let curSfxEl = null;
      let synthLoopId = null;
      let sfxSeq = 0;
      let firstPlayFailCount = {};

      function stopSfx() {
        if (synthLoopId) {
          clearInterval(synthLoopId);
          synthLoopId = null;
        }
        if (curSfxEl) {
          const a = curSfxEl;
          curSfxEl = null;
          try {
            a.pause();
            a.currentTime = 0;
          } catch (e) {}
        }
      }

      function playSound(name, loop) {
        const seq = ++sfxSeq;

        const useSynth = () => {
          if (seq !== sfxSeq) return; /* superseded */
          synth(name);
          if (loop) {
            synthLoopId = setInterval(() => {
              if (seq === sfxSeq) synth(name);
            }, 900);
          }
        };

        const url = nextFromPool(name);
        if (!url) {
          useSynth();
          return;
        }

        let started = false;
        const a = new Audio();
        curSfxEl = a;
        a.volume = S.sfxMute ? 0 : S.sfxVol;
        a.loop = !!loop;
        a.preload = "auto";
        a.src = url;

        a.addEventListener("playing", () => {
          started = true;
        });
        a.addEventListener("error", () => {
          if (seq !== sfxSeq) return;
          reportPoolFail(name);
          useSynth();
        });

        const p = a.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => {
            if (seq !== sfxSeq) return;
            reportPoolFail(name);
            useSynth();
          });
        }

        /* If nothing started after 700ms, assume the file is missing. */
        setTimeout(() => {
          if (seq !== sfxSeq) return;
          if (!started) {
            reportPoolFail(name);
            useSynth();
          }
        }, 700);
      }

      function sfx(name, loop) {
        if (S.sfxMute) return;
        unlockAudio();
        stopSfx();
        playSound(name, loop);
      }

      /* ============================================================
   FACE ANIMATION
   ============================================================ */
      const FACE_TARGETS = {

        blunder: {

        },
        mistake: {
          bL: [24, 30, 32, 34, 42, 36],
          bR: [58, 30, 68, 26, 76, 28],
          eR: 7,

          gazeX: 2,

        capture: {
          bL: [24, 32, 32, 28, 42, 30],

        },
        check: {

        },
        panic: {

        },
        promo: {

        },
        win: {
          bL: [24, 30, 32, 24, 42, 28],
          bR: [58, 28, 68, 24, 76, 30],
          eR: 9,
          mouth: "M36 76 Q50 90 64 76",
          sweat: 0,

        },
        lose: {
          bL: [24, 38, 32, 42, 42, 42],
          bR: [58, 42, 68, 42, 76, 38],
          eR: 6,
          mouth: "M40 84 L60 84",
          sweat: 0.5,

        },
      };
      const faceState = {
        key: "idle",
        t: 0,

      };
      let faceRAF = null,
        faceLast = performance.now();
      function setFace(k) {
        faceState.key = FACE_TARGETS[k] ? k : "idle";
      }
      function faceTick(now) {
        const dt = Math.min((now - faceLast) / 1000, 0.05);
        faceLast = now;
        faceState.t += dt;
        faceState.talking = Math.max(0, faceState.talking - dt);
        faceState.bob =
          Math.sin(faceState.t * 2.2) * (faceState.talking > 0 ? 2.4 : 0.7);
        faceState.blink += dt;
        if (faceState.blink > 3.5) faceState.blink = 0;
        faceState.lookTimer += dt;
        let lookX = 0;
        if (faceState.lookTimer > 5) {
          if (faceState.lookTimer < 5.6)
            lookX = Math.sin(((faceState.lookTimer - 5) * Math.PI) / 0.6) * 5;
          else faceState.lookTimer = 0;
        }
        const bL = $("#browL"),
          bR = $("#browR"),
          eL = $("#eyeL"),
          eR = $("#eyeR"),
          pL = $("#pupilL"),
          pR = $("#pupilR"),
          mouth = $("#mouth"),
          sw = $("#sweat"),
          blL = $("#blushL"),
          blR = $("#blushR"),
          head = $("#face-head");
        if (bL) {
          const T = FACE_TARGETS[faceState.key] || FACE_TARGETS.idle;
          const bob = faceState.bob;
          bL.setAttribute(
            "d",
            `M${T.bL[0]} ${T.bL[1] + bob} Q${T.bL[2]} ${T.bL[3] + bob} ${T.bL[4]} ${T.bL[5] + bob}`,
          );

            "d",
            `M${T.bR[0]} ${T.bR[1] + bob} Q${T.bR[2]} ${T.bR[3] + bob} ${T.bR[4]} ${T.bR[5] + bob}`,
          );
          mouth.setAttribute("d", T.mouth);
          mouth.setAttribute("transform", `translate(0 ${bob})`);
          const blinking = faceState.blink > 3.35;
          const eyeScale = blinking
            ? 0.15
            : 1 + Math.sin(faceState.t * 1.7) * 0.05;
          const gazeX = (T.gazeX || 0) + lookX;
          const gazeY = (T.gazeY || 0) + bob * 0.5;
          eL.setAttribute("ry", T.eR * eyeScale);
          eR.setAttribute("ry", T.eR * eyeScale);
          eL.setAttribute("cx", 34 + gazeX * 0.3);
          eR.setAttribute("cx", 66 + gazeX * 0.3);

          pR.setAttribute("cy", 50 + bob + gazeY * 0.3);

            "opacity",

          blR.setAttribute("opacity", T.blush);
          const tilt = Math.sin(faceState.t * 0.8) * 1.5;
          head.setAttribute("transform", `rotate(${tilt} 50 50)`);
        }
        faceRAF = requestAnimationFrame(faceTick);
      }
      function startFaceLoop() {
        if (faceRAF) return;
        faceLast = performance.now();
        faceRAF = requestAnimationFrame(faceTick);
      }
      function facePulse() {
        faceState.talking = 1.2;
      }

          p.streak = 0;
          save();
          flash[n] = "blunder";
          flash[tsq] = "blunder";
          setFace("mistake");
          cs("That was " + tsq.toUpperCase() + ".");
        }
        render();
        setTimeout(() => {
          flash = {};
          nextSq();
          render();
        }, 900);
        checkJourneyAdvance("sq");
      }
      function loadPieceDrill() {
        g = new Chess();
        g.clear();
        const types = ["p", "n", "b", "r", "q"];
        const t = types[(Math.random() * types.length) | 0];
        const sq =
          "abcdefgh"[(Math.random() * 8) | 0] + ((1 + Math.random() * 8) | 0);
        g.put({ type: t, color: Math.random() < 0.5 ? "w" : "b" }, sq);
        window._pieceTarget = { type: t, sq };
        $("#tp").textContent =
          "Tap the " +
          { p: "pawn", n: "knight", b: "bishop", r: "rook", q: "queen" }[t] +
          " · streak " +
          streak +
          " · " +
          drillProgress("pieces").done +
          "/" +
          JOURNEY_LEVELS[1].req;
        sel = null;
        tgt = [];
      }
      function trainPiece(n) {
        const pt = window._pieceTarget;
        if (!pt) return;
        const p = g.get(n);
        const ok = p && p.type === pt.type;
        const d = drillProgress("pieces");
        flash = {};
        if (ok) {
          d.done++;
          streak++;
          d.streak = streak;
          d.best = Math.max(d.best, streak);
          save();
          flash[n] = "blunder";
          setFace("good");
        } else {
          streak = 0;
          d.streak = 0;
          save();
          flash[n] = "blunder";
          if (pt.sq) flash[pt.sq] = "blunder";
          setFace("mistake");
        }
        render();
        setTimeout(() => {
          flash = {};
          loadPieceDrill();
          render();
        }, 900);
        checkJourneyAdvance("pieces");
      }
      function loadAtkDrill() {
        g = new Chess();
        g.clear();
        const types = ["n", "b", "r", "q"];
        const t = types[(Math.random() * types.length) | 0];
        const sq =
          "abcdefgh"[(Math.random() * 8) | 0] + ((1 + Math.random() * 8) | 0);
        g.put({ type: t, color: "w" }, sq);
        const targets = g.moves({ square: sq, verbose: true }).map((m) => m.to);
        window._atkTarget = {
          type: t,
          sq,
          found: new Set(),
          all: new Set(targets),
        };
        $("#tp").textContent =
          "Tap ALL squares your " +
          { n: "knight", b: "bishop", r: "rook", q: "queen" }[t] +
          " attacks · streak " +
          streak;
        sel = sq;
        tgt = [...targets];
      }
      function trainAtk(n) {
        const A = window._atkTarget;
        if (!A) return;
        flash = {};
        if (A.all.has(n)) {
          A.found.add(n);
          flash[n] = "blunder";
        } else {
          flash[n] = "blunder";
          setFace("mistake");
          render();
          setTimeout(() => {
            flash = {};
            render();
          }, 600);
          return;
        }
        render();
        if (A.found.size === A.all.size) {
          const d = drillProgress("atk");
          d.done++;
          streak++;
          d.streak = streak;
          d.best = Math.max(d.best, streak);
          save();
          setFace("great");
          setTimeout(() => {
            flash = {};
            loadAtkDrill();
            render();
          }, 900);
          checkJourneyAdvance("atk");
        }
      }
      const MT = [
        "6k1/5ppp/8/8/8/8/5PPP/R5K1 w - - 0 1",
        "r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 0 1",
        "7k/5Q2/6K1/8/8/8/8/8 w - - 0 1",
        "6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1",
        "8/8/8/8/8/1k6/8/K1R5 w - - 0 1",
      ];
      function loadMate() {
        const p = drillProgress("mate");
        mi = p.done % MT.length;
        g = new Chess(MT[mi]);
        sel = null;
        tgt = [];
        last = null;
        hint = null;
        $("#tp").textContent =
          "Find mate in 1 · streak " +
          streak +
          " · " +
          p.done +
          "/" +
          JOURNEY_LEVELS[3].req;
      }
      function trainMate(f, t) {
        const m = g.move({ from: f, to: t, promotion: "q" });
        if (!m) return;
        sel = null;
        tgt = [];
        if (g.in_checkmate()) {
          const d = drillProgress("mate");
          d.done++;
          streak++;
          d.streak = streak;
          d.best = Math.max(d.best, streak);
          save();
          fx(m);
          render();
          setFace("great");
          setTimeout(() => {
            loadMate();
            render();
          }, 1400);
          checkJourneyAdvance("mate");
        } else {
          g.undo();
          streak = 0;
          const d = drillProgress("mate");
          d.streak = 0;
          save();
          setFace("mistake");
          $("#tp").textContent = "Find mate in 1 · streak 0";
          render();
        }
      }

      function openSettings() {
        $("#musicvol").value = S.musicVol * 100;
        $("#musicvolval").textContent = Math.round(S.musicVol * 100);
        $("#sfxvol").value = S.sfxVol * 100;
        $("#sfxvolval").textContent = Math.round(S.sfxVol * 100);
        $("#musicmute").checked = S.musicMute;
        $("#sfxmute").checked = S.sfxMute;
        show("settings");
      }

      function applyTheme() {
        const t = S.theme;
        t.lt = $("#c-lt").value;
        t.dk = $("#c-dk").value;
        save();
        document.documentElement.style.setProperty("--lt", t.lt);
        document.documentElement.style.setProperty("--dk", t.dk);
        if (["play", "mate", "sq", "pieces", "atk"].includes(mode)) render();
      }
      function openTheme() {
        const t = S.theme;
        $("#c-lt").value = t.lt;
        $("#c-dk").value = t.dk;
        show("theme");
      }
      function resetTheme() {
        S.theme = { lt: "#7c3aed", dk: "#0a0416" };
        save();
        openTheme();
        applyTheme();
      }

      function speak(t, p) {
        if (!$("#vo") || !$("#vo").checked || !window.speechSynthesis) return;
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(
            String(t).replace(/[^\x00-\x7F]/g, ""),
          );
          u.pitch = p || 0.9;
          u.rate = 1.08;
          speechSynthesis.speak(u);
        } catch (e) {}
      }
      function flashOnce(sq, kind) {
        flash[sq] = kind;
        render();
        setTimeout(() => {
          delete flash[sq];
          render();
        }, 1500);
      }

      eloLab();
      (function initTheme() {
        const t = S.theme;
        $("#c-lt").value = t.lt;
        $("#c-dk").value = t.dk;
        document.documentElement.style.setProperty("--lt", t.lt);
        document.documentElement.style.setProperty("--dk", t.dk);
      })();
      window.addEventListener("load", () => {
        const startOnFirstTap = () => {
          unlockAudio();
          startMenuMusic();
          document.removeEventListener("click", startOnFirstTap);
          document.removeEventListener("touchstart", startOnFirstTap);
        };
        document.addEventListener("click", startOnFirstTap, { once: true });
        document.addEventListener("touchstart", startOnFirstTap, {
          once: true,
        });
      });

      /* ---- Debug helpers ---- */
      window.testSfx = function (name) {
        console.log(
          "testSfx(" + name + ") | AC:",
          AC && AC.state,
          "| sfxVol:",
          S.sfxVol,
          "| mute:",
          S.sfxMute,
        );
        sfx(name);
      };
      window.testAllSfx = function () {
        const names = ["move", "capture", "check", "win", "lose"];
        names.forEach((n, i) => setTimeout(() => sfx(n), i * 1100));
      };
      window.showPoolStatus = function () {
        console.table(
          Object.keys(POOL_SIZES).map((k) => ({
            pool: k,
            files: POOL_SIZES[k],
            dead: !!poolDead[k],
            fails: poolFailCount[k] || 0,
          })),
        );
      };
    </script>
  </body>
</html>
